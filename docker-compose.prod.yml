services:
  # Flask API + Selenium Scraper (Produzione)
  scraper:
    container_name: webapp_scraper_prod
    build:
      context: ./
      dockerfile: scraper/Dockerfile
    expose:
      - "5001"  # Solo esposto internamente
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    restart: always
    networks:
      - webapp-network
    # Aumenta shared memory per Chrome
    shm_size: 2gb
    # Opzionale: limita risorse
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Nginx per servire file statici e proxy API
  nginx:
    container_name: webapp_nginx_prod
    image: nginx:alpine
    ports:
      - "8082:80"  # Porta per talkchain.xyz
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/html:ro  # File statici della build
      - ./ssl:/etc/nginx/ssl:ro  # Certificati SSL (opzionale)
    depends_on:
      - webapp_server
      - react_builder
      - scraper
    restart: always
    networks:
      - webapp-network

  # Server WebApp - produzione
  webapp_server:
    container_name: webapp_server_prod
    build:
      context: ./
      dockerfile: server/Dockerfile.prod
    expose:
      - "5000"  # Solo esposto internamente
    environment:
      MONGODB_URI: ${MONGODB_URI}
      NODE_ENV: production
      PORT: 5000
    depends_on:
      - mongodb
    restart: always
    networks:
      - webapp-network

  # Builder per React app (solo per la build)
  react_builder:
    container_name: webapp_react_builder
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      target: builder
    volumes:
      - static_files:/output
    command: ["sh", "-c", "cp -r /app/build/* /output/ && echo 'Build copied successfully'"]
    networks:
      - webapp-network

  # MongoDB per produzione
  mongodb:
    container_name: webapp_mongodb_prod
    image: mongo:4.4
    expose:
      - "27017"  # Solo esposto internamente
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: webapp
    volumes:
      - webapp_mongodb_prod_data:/data/db
    restart: always
    networks:
      - webapp-network

volumes:
  webapp_mongodb_prod_data:
  static_files:

networks:
  webapp-network:
    driver: bridge
