events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream webapp_server_upstream {
        server webapp_server:5000;
    }

    upstream scraper_api_upstream {
        server scraper:5001;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static files
        location /public/ {
            alias /var/www/html/public/;
            expires 4h;
            add_header Cache-Control "public, max-age=14400, must-revalidate";
        }

        # Flask Scraper API routes
        location /api/odds/ {
            proxy_pass http://scraper_api_upstream/api/odds/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;  # 15 minuti per scraping lungo
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
        }

        # API routes (Node.js)
        location /api/ {
            proxy_pass http://webapp_server_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve React app - try a more explicit approach
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ @fallback;
        }

        location @fallback {
            root /var/www/html;
            try_files /index.html =404;
        }

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
}
